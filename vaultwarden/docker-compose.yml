services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: solari-vdi-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: http://127.0.0.1:8222
      SIGNUPS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8222:80"
